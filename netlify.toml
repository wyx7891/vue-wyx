[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20.19.0" }

# SPA重定向 - 将所有非文件请求重定向到index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 针对不同类型的资源设置正确的MIME类型
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
